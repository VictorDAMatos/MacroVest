server:
  port: 8080

spring:
  application:
    name: vault-api
  datasource:
    url: jdbc:mysql://localhost:3306/vault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# URLs dos serviços internos (usadas a partir da Etapa 7)
vault:
  servicos:
    dados-url: http://localhost:8081
    simulador-url: http://localhost:8082

    resilience4j:
      circuitbreaker:
        instances:
          vaultDadosCB:
            sliding-window-type: COUNT_BASED
            sliding-window-size: 5
            minimum-number-of-calls: 3
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 2
            register-health-indicator: true
      retry:
        instances:
          vaultDadosRetry:
            max-attempts: 3
            wait-duration: 300ms
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - org.springframework.web.client.HttpServerErrorException
              - java.io.IOException